# Pushing a version tag (e.g. v0.4.0) tests AutoSplit64++ on macOS and Windows, builds it for both
# once the tests pass, and publishes them as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

# Only publishing the release writes
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-26
            platform: macos-arm64
          - os: windows-2025
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      ASSET: AutoSplit64plusplus-${{ github.ref_name }}-${{ matrix.platform }}.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Actions are pinned to their commits, as a tag can be moved to other code, which this job's secrets would reach
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Not from the tests' cache, which other runs write, as this build is signed and published
          enable-cache: false

      # build.py puts the plugin in the Windows app; configuring downloads the OBS sources it builds against.
      # The runner has Visual Studio 2026 instead of the preset's 2022.
      - name: Build the OBS plugin
        if: runner.os == 'Windows'
        working-directory: obs-plugin
        run: |
          cmake --preset windows-x64 -G "Visual Studio 18 2026"
          cmake --build --preset windows-x64

      # macOS keeps the app's Screen Recording and Camera permissions across updates while each release is signed
      # with the same certificate. It's self-signed, made once with:
      #   openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 9125 -subj "/CN=AutoSplit64plusplus" \
      #     -addext "keyUsage=critical,digitalSignature" -addext "extendedKeyUsage=critical,codeSigning"
      #   openssl pkcs12 -export -legacy -inkey key.pem -in cert.pem -out cert.p12
      # and kept base64 encoded in the MACOS_SIGNING_CERTIFICATE secret, with its password in MACOS_SIGNING_PASSWORD.
      # A new certificate costs everyone the permissions once more.
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain" > /dev/null
          # codesign only finds identities in the keychains it searches
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # It's untrusted, being self-signed, which codesign doesn't mind
          identity=$(security find-identity -p codesigning "$keychain" | awk '$1 == "1)" { print $2; exit }')
          [ -n "$identity" ] || { echo "No signing identity in the certificate"; exit 1; }
          echo "AS64_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build
        run: uv run build.py
        env:
          AS64_VERSION: ${{ github.ref_name }}

      # build.py only warns when the plugin is missing, which is fine locally but not for a release
      - name: Check the OBS plugin is in the app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/AutoSplit64++/obs-plugin/autosplit64plus-framegrabber.dll")) { throw "The OBS plugin is missing from the app" }

      - name: Package the app
        if: runner.os == 'macOS'
        # ditto keeps the app's symlinks and signature
        run: ditto -c -k --keepParent "dist/AutoSplit64++.app" "$ASSET"

      - name: Package the app folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/AutoSplit64++" -DestinationPath "$env:ASSET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true

      # The app's updater checks downloads against these
      - name: Checksums
        run: sha256sum *.zip > SHA256SUMS

      # Tags with a suffix, e.g. v0.4.0-rc.1, are pre-releases, which the app doesn't offer as updates
      - name: Publish the release
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease *.zip SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
