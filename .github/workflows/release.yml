# Pushing a version tag (e.g. v0.4.0) tests and builds AutoSplit64++ for macOS and Windows,
# and publishes them as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-26
            platform: macos-arm64
          - os: windows-2025
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      ASSET: AutoSplit64plusplus-${{ github.ref_name }}-${{ matrix.platform }}.zip
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Test
        run: uv run python -m unittest -v

      - name: Build
        run: uv run build.py
        env:
          AS64_VERSION: ${{ github.ref_name }}

      - name: Package the app
        if: runner.os == 'macOS'
        # ditto keeps the app's symlinks and signature
        run: ditto -c -k --keepParent "dist/AutoSplit64++.app" "$ASSET"

      - name: Package the app folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/AutoSplit64++" -DestinationPath "$env:ASSET"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # The app's updater checks downloads against these
      - name: Checksums
        run: sha256sum *.zip > SHA256SUMS

      # Tags with a suffix, e.g. v0.4.0-rc.1, are pre-releases, which the app doesn't offer as updates
      - name: Publish the release
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease *.zip SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
