# Runs the tests on macOS and Windows. Every release runs them first (see release.yml);
# they also can be run by hand. They don't run on pushes, to save CI minutes.
name: Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    strategy:
      # See every platform's failures, not only the first one's
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Actions are pinned to their commits, as a tag can be moved to other code
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Test
        run: uv run pytest -v
