[project]
name = "autosplit64plusplus"
# Unused: releases are versioned by their git tag (see build.py)
version = "0"
description = "Automatic splitting for Super Mario 64 speedruns, based on AutoSplit64+"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyQt6==6.8.0",
    "numpy==2.0.2",
    "opencv-python==4.10.0.84",
    "psutil==6.1.1",
    "onnxruntime==1.20.1",
    "requests==2.32.3",
    "websockets==17.2",
    "pywin32==308; sys_platform == 'win32'",
    "pywin32-ctypes==0.2.3; sys_platform == 'win32'",
    "pyobjc-framework-ScreenCaptureKit==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch==12.2.2; sys_platform == 'darwin'",
    "windows-capture==2.0.1; sys_platform == 'win32'",
    "qt-themes==0.4.1",
    "qtpy==2.4.3",
]

[dependency-groups]
dev = [
    "pyinstaller==6.11.1",
    "yt-dlp==2026.8.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autosplit64"]

[tool.uv]
# AutoSplit64++ runs on Windows and macOS
environments = ["sys_platform == 'win32'", "sys_platform == 'darwin'"]
